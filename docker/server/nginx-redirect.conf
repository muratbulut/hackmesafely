# __DOMAIN__ -> https://__TARGET__ (eski adres; her istek aynı yola kalıcı olarak yönlenir)
# Yayın iş akışı kurar (docker/server/install-nginx.sh --redirect) ve her yayında bu şablondan
# yeniden yazar. Site 17 Kasım 2026'da bitirme.muratbulut.net'ten hackmesafely.com'a taşındı;
# eski bağlantılar (QR kodları, mailler, sunum) bozulmasın diye eski adres yönlendirir.
# Sertifika eski adresin Cloudflare Origin sertifikasıdır (docker/server/<alan>.pem).

# Yalnızca Cloudflare'den gelen bağlantı (nginx-site.conf'taki kuralın aynısı).
geo $realip_remote_addr $from_cloudflare___SITE_ID__ {
    default 0;
    127.0.0.1 1;
    ::1 1;
    __CLOUDFLARE_GEO__
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    if ($from_cloudflare___SITE_ID__ = 0) {
        return 444;
    }
    return 301 https://__TARGET__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/nginx/ssl/__DOMAIN__/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($from_cloudflare___SITE_ID__ = 0) {
        return 444;
    }
    # Tarayıcının hatırladığı HSTS (bir yıl) eski adreste de geçerli kalsın.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://__TARGET__$request_uri;
}
